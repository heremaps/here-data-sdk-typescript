name: Typescript SDK Deploy Workflow

on:
  workflow_dispatch:
    inputs:
      chooseDeploy:
        description: 'Package to deploy'
        required: true
        default: ''
        type: choice
        options:
        - fetch
        - api
        - core
        - auth
        - read
        - write
        - verify

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  deploy-sdk-package-to-npm:
    name: Typescript SDK Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Package to deploy: $PACKAGE_NAME"
        env:
          PACKAGE_NAME: ${{ inputs.chooseDeploy }}
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false  # never use caching in release builds
      # MockServer, which backs the functional tests, ships Java 17 bytecode.
      # The runner defaults to Java 11, so pin the version the jar needs.
      - name: Use Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build / Tests
        run: scripts/linux/psv/build_test_psv.sh && env
      - name: Deploy to NPM
        run: scripts/publish-packages.sh -${PACKAGE_NAME}
        env:
          PACKAGE_NAME: ${{ inputs.chooseDeploy }}
